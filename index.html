<!-- Псевдокласс - это селекторы, которые уточняют тип или состояние элемента, 
    позволяя управлять динамическими параметрами интерфейса,
    такими как действия пользователя  или валидность данных
    Синтаксис:

    элемент:псевдокласс {
        свойство: значение;
    }

    Основные псевдоклассы:
    :hover - состояние при наведении курсора на элемент
    :focus - состояние, когда элемент получил фокус
    :nth-child() - выбор элементов по их порядку среди соседей (например, even, odd или номер)
    :not() - выбор всех элементов, кроме указанных
    :first-child и :last-child - выбор первого или последнего дочернего элемента

    Псевдоэлементы - это виртуальные элементы, которых нет в HTML,
    но которые можно создать и стилизовать через CSS.
    Они идеальны для декоративных целей, упрощая код и избегая лишних тегов.
    Синтаксис:

    элемент::псевдоэлемент {
        свойство: значение;
    }

    Основные псевдоэлементы:
    ::before - добавляет содержимое перед элементом
    ::after - добавляет содержимое после элемента
    ::placeholder - стилизует текст-заполнитель внутри поля ввода
    Для ::before и ::after нужно задавать свойство content, иначе псевдоэлемент не появится
    -->




<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание 19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Сложные селекторы, псевдоклассы, псевдоэлементы</h1>
        <p class="intro">Пример работы с псевдоклассами и псевдоэлементами.</p>

        <section class="color_button">
            <h2>Hover</h2>
            <button type="button">При наведении цвет текста меняется</button>
            <button type="button" disabled>Отключённая кнопка (без hover)</button>
        </section>

        <section class="color_input">
            <h2>Focus и placeholder</h2>
            <label for="name">Введите имя</label>
            <input type="text" id="name" placeholder="Ваше имя">
        </section>

        <section class="elements_style">
            <h2>:nth-child(even) и :nth-child(odd)</h2>
            <ul>
                <li>Элемент 1</li>
                <li>Элемент 2</li>
                <li>Элемент 3</li>
                <li>Элемент 4</li>
            </ul>
            <p>Обычный абзац: получает галочку через :not().</p>
        </section>
    </div>
</body>
</html>
